<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polymer documentation has moved</title>
<meta http-equiv="refresh" content="2; url=https://digitalpolygon.github.io/polymer-drupal-monorepo/latest/">
<link rel="canonical" href="https://digitalpolygon.github.io/polymer-drupal-monorepo/latest/">
<script>
(function () {
  var base = 'https://digitalpolygon.github.io/polymer-drupal-monorepo/latest/';
  var parts = window.location.pathname.split('/').filter(Boolean);
  // parts[0] = old repo name, parts[1] = mike version, rest = page path.
  var rest = parts.slice(2).join('/');
  var target;
  if (!rest) {
    target = base + 'core/';
  } else if (rest === 'commands' || rest.indexOf('commands/') === 0) {
    // The command reference is unified (not per-section) on the new site.
    target = base + rest + (rest.slice(-1) === '/' ? '' : '/');
  } else {
    target = base + 'core/' + rest + (rest.slice(-1) === '/' ? '' : '/');
  }
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>The Polymer documentation has moved to the
<a href="https://digitalpolygon.github.io/polymer-drupal-monorepo/latest/">unified Polymer family documentation site</a>.</p>
</body>
</html>
